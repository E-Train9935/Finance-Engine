name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r apps/api/requirements.txt
      - run: pytest -q
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build
