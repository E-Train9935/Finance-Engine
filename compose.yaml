services:
  finengine:
    build:
      context: .
      dockerfile: Dockerfile

    image: finengine:local
    container_name: finengine-local

    ports:
      - "8000:8000"

    env_file:
      - ./apps/api/.env

    environment:
      PORT: 8000

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s